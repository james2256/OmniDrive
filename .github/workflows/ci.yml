name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build:worker
      - run: npm run build:web
        env:
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL || 'http://localhost:8999' }}
      - run: npm run format:check
