# Omnidrive API — Cloudflare Worker Configuration
# Copy this file to wrangler.toml and fill in your values:
#   cp wrangler.example.toml wrangler.toml

name = "omnidrive-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat_v2"]

[triggers]
crons = ["*/30 * * * *"]

# D1 Database — create with: npx wrangler d1 create omnidrive
[[d1_databases]]
binding = "DB"
database_name = "omnidrive"
database_id = "<your-d1-database-id>"

# KV Namespace — create with: npx wrangler kv namespace create KV
[[kv_namespaces]]
binding = "KV"
id = "<your-kv-namespace-id>"

[vars]

# Security secrets — set via:
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put TOKEN_ENCRYPTION_KEY
# Generate with: node -e "console.log(crypto.randomUUID().replace(/-/g,''))"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# CPU time limit per invocation (Paid plan). Default is 30000ms (30s).
# Set to 60s to give sync headroom for large drives (44 pages × ~1ms CPU/page
# for D1 + JSON parsing). Free plan is hardcoded to 10ms — cannot be raised
# here, only by upgrading to Workers Paid.
# Ref: https://developers.cloudflare.com/workers/platform/limits/
[limits]
cpu_ms = 60000
