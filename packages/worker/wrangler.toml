name = "omnidrive"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = [ "nodejs_compat_v2" ]

[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "omnidrive"
database_id = "85427fa6-e0ce-4642-92e6-52b638643ef4"

[[kv_namespaces]]
binding = "KV"
id = "f15360e6e6564f0cbec9d5678142abea"

[[queues.producers]]
queue = "sync-jobs"
binding = "SYNC_QUEUE"

[[queues.consumers]]
queue = "sync-jobs"
max_batch_size = 1
max_concurrency = 1
max_retries = 3

[vars]
FRONTEND_URL = "https://omnidrive-7w1.pages.dev"
WORKER_URL = "https://omnidrive.rvdrive.workers.dev"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
destinations = ["grafana-logs"]

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
destinations = ["grafana-traces"]

# CPU time limit per invocation (Paid plan). Default is 30000ms (30s).
# Set to 60s to give sync headroom for large drives (44 pages × ~1ms CPU/page
# for D1 + JSON parsing). Free plan is hardcoded to 10ms — cannot be raised
# here, only by upgrading to Workers Paid.
# Ref: https://developers.cloudflare.com/workers/platform/limits/
[limits]
cpu_ms = 60000
